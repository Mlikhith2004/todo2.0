
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>My To-Do List</h1>
            <p class="subtitle">Organize your day, one task at a time.</p>
        </header>

        <!-- Task Input Section -->
        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="What needs to be done?"
                autocomplete="off"
            >

            <button id="addBtn">+ Add Task</button>

        </div>

        <!-- Task Information -->
        <div class="task-info">
            <span id="taskCount">0 tasks remaining</span>
            <span id="completedCount">0 completed</span>
        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <!-- Empty Message -->
        <p id="emptyMessage">✨ Your task list is empty. Add something!</p>

        <footer>
            <p>Stay focused. Stay productive.</p>
        </footer>

    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>
</html>
